<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="32" text-anchor="middle" style="fill:rgb(20, 20, 19); font-family: sans-serif; font-size:14px; font-weight:500;">Student Attendance Request Flow</text>

<!-- Step 1: Student Initiates -->
<g>
  <rect x="220" y="52" width="240" height="52" rx="8" style="fill:rgb(225, 245, 238); stroke:rgb(15, 110, 86); stroke-width:0.5px;"/>
  <text x="340" y="72" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8, 80, 65); font-family: sans-serif; font-size:14px; font-weight:500;">Student submits request</text>
  <text x="340" y="90" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15, 110, 86); font-family: sans-serif; font-size:12px;">Subject, Date, &amp; Reason</text>
</g>

<line x1="340" y1="104" x2="340" y2="132" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Step 2: Document Upload -->
<g>
  <rect x="220" y="132" width="240" height="52" rx="8" style="fill:rgb(230, 241, 251); stroke:rgb(24, 95, 165); stroke-width:0.5px;"/>
  <text x="340" y="152" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124); font-family: sans-serif; font-size:14px; font-weight:500;">Upload supporting file</text>
  <text x="340" y="170" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165); font-family: sans-serif; font-size:12px;">Stored in Firebase/S3</text>
</g>

<line x1="340" y1="184" x2="340" y2="212" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Step 3: Backend Validation -->
<g>
  <rect x="220" y="212" width="240" height="52" rx="8" style="fill:rgb(238, 237, 254); stroke:rgb(83, 74, 183); stroke-width:0.5px;"/>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60, 52, 137); font-family: sans-serif; font-size:14px; font-weight:500;">FastAPI processes request</text>
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83, 74, 183); font-family: sans-serif; font-size:12px;">Auth check &amp; validation</text>
</g>

<line x1="340" y1="264" x2="340" y2="292" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Step 4: Pending Review -->
<g>
  <rect x="220" y="292" width="240" height="52" rx="8" style="fill:rgb(250, 238, 218); stroke:rgb(133, 79, 11); stroke-width:0.5px;"/>
  <text x="340" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99, 56, 6); font-family: sans-serif; font-size:14px; font-weight:500;">Teacher/HOD Review</text>
  <text x="340" y="330" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133, 79, 11); font-family: sans-serif; font-size:12px;">Multi-level approval chain</text>
</g>

<!-- Rejection Path -->
<line x1="220" y1="318" x2="150" y2="318" marker-end="url(#arrow)" style="stroke:rgb(163, 45, 45); stroke-width:1.5px; fill:none;"/>
<text x="185" y="310" text-anchor="middle" style="fill:rgb(163, 45, 45); font-family: sans-serif; font-size:11px;">Reject</text>
<g>
  <rect x="40" y="296" width="110" height="44" rx="8" style="fill:rgb(252, 235, 235); stroke:rgb(163, 45, 45); stroke-width:0.5px;"/>
  <text x="95" y="318" text-anchor="middle" style="fill:rgb(121, 31, 31); font-family: sans-serif; font-size:13px; font-weight:500;">Rejected</text>
</g>

<line x1="340" y1="344" x2="340" y2="372" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Step 5: Faculty Marking -->
<g>
  <rect x="190" y="372" width="300" height="52" rx="8" style="fill:rgb(250, 236, 231); stroke:rgb(153, 60, 29); stroke-width:0.5px;"/>
  <text x="340" y="392" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113, 43, 19); font-family: sans-serif; font-size:14px; font-weight:500;">Faculty marks attendance</text>
  <text x="340" y="410" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153, 60, 29); font-family: sans-serif; font-size:12px;">Final system update</text>
</g>

<line x1="340" y1="424" x2="340" y2="452" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Step 6: Completion & Notification -->
<g>
  <rect x="220" y="452" width="240" height="52" rx="8" style="fill:rgb(234, 243, 222); stroke:rgb(59, 109, 17); stroke-width:0.5px;"/>
  <text x="340" y="472" text-anchor="middle" dominant-baseline="central" style="fill:rgb(39, 80, 10); font-family: sans-serif; font-size:14px; font-weight:500;">Student notified</text>
  <text x="340" y="490" text-anchor="middle" dominant-baseline="central" style="fill:rgb(59, 109, 17); font-family: sans-serif; font-size:12px;">FCM Push Notification sent</text>
</g>

<line x1="340" y1="504" x2="340" y2="532" marker-end="url(#arrow)" style="stroke:rgb(115, 114, 108); stroke-width:1.5px; fill:none;"/>

<!-- Real-time tracking / Result -->
<g>
  <rect x="270" y="532" width="140" height="40" rx="20" style="fill:rgb(241, 239, 232); stroke:rgb(95, 94, 90); stroke-width:0.5px;"/>
  <text x="340" y="552" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68, 68, 65); font-family: sans-serif; font-size:14px; font-weight:500;">Status: Approved</text>
</g>

<!-- Labels for Tech stack -->
<text x="500" y="80" style="fill:rgb(115, 114, 108); font-family: sans-serif; font-size:11px;">Mobile (Flutter)</text>
<text x="500" y="240" style="fill:rgb(115, 114, 108); font-family: sans-serif; font-size:11px;">Backend (FastAPI)</text>
<text x="500" y="400" style="fill:rgb(115, 114, 108); font-family: sans-serif; font-size:11px;">Database (Postgres)</text>

</svg>